[project]
name = "mlblock"
version = "0.1.0"
description = "MLBlock - visual block builder for PyTorch neural networks"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.20",
    "gymnasium>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "python-jose>=3.5.0",
    "cryptography>=49.0.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Correctness only (pycodestyle errors + pyflakes bugs). isort/upgrade exclus :
# le codebase n'a jamais été linté, éviter le churn de formatage/imports.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Fichiers de définition de blocs : les signatures (annotations descriptives en
# chaînes, métadonnées du DSL) sont volontairement longues — convention du repo.
# Les F821 des annotations sont traitées ligne par ligne (# noqa) pour ne jamais
# masquer une vraie faute de frappe dans le corps exécutable d'un bloc.
"mlblock/blocks/**/*.py" = ["E501"]

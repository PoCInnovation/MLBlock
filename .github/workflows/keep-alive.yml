name: keep-alive

on:
  schedule:
    # Toutes les 5 min — le scheduler GitHub peut retarder les crons (jitter
    # observé jusqu'à 45 min), 5 min laisse de la marge sous la fenêtre de 15 min
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le backend Render
        run: curl -fsS --max-time 120 https://mlblock-backend.onrender.com/health

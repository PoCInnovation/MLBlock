services:
  # ── Backend FastAPI ──────────────────────────────────────────────
  - type: web
    plan: free
    name: mlblock-backend
    runtime: python
    pythonVersion: 3.11
    rootDir: backend
    buildCommand: uv sync
    startCommand: .venv/bin/uvicorn mlblock.server.main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      ignoredPaths:
        - frontend/**
        - openspec/**
    envVars:
      # Database — Supabase PostgreSQL (transaction mode pooler)
      - key: DATABASE_URL
        sync: false
      # Supabase project credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # GPU (Vast.ai)
      - key: VAST_API_KEY
        sync: false
      # Mode d'exécution : gpu explicite en prod (défaut local en dev)
      - key: MLBLOCK_RUN_MODE
        value: gpu
      # CORS — restrict to frontend
      - key: CORS_ORIGINS
        value: https://mlblock-frontend.onrender.com
      # GPU callbacks
      - key: BACKEND_URL
        value: https://mlblock-backend.onrender.com
      - key: GPU_API_KEY
        generateValue: true

  # ── Frontend React/Vite (TanStack Start SSG prerender → Static) ─
  - type: web
    name: mlblock-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL=https://mlblock-backend.onrender.com npm run build
    buildFilter:
      ignoredPaths:
        - backend/**
        - openspec/**
    staticPublishPath: dist/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

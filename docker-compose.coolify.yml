services:
  # ── Backend FastAPI Service ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlblock-backend
    restart: unless-stopped
    environment:
      # Database — Supabase PostgreSQL (transaction mode pooler, port 6543)
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      # Supabase Authentication and Project Credentials
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL is required}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      # GPU execution via Vast.ai REST API
      - VAST_API_KEY=${VAST_API_KEY:?VAST_API_KEY is required}
      - MLBLOCK_RUN_MODE=${MLBLOCK_RUN_MODE:-gpu}
      # CORS and Callback endpoints
      - CORS_ORIGINS=${CORS_ORIGINS:-http://frontend.141.253.110.210.sslip.io,https://frontend.141.253.110.210.sslip.io}
      - BACKEND_URL=${BACKEND_URL:-http://backend.141.253.110.210.sslip.io}
      - GPU_API_KEY=${GPU_API_KEY:-your-shared-gpu-api-key-for-callbacks}
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mlblock-network
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      # HTTP router (active immediately)
      - "traefik.http.routers.backend-http.rule=Host(`${BACKEND_DOMAIN:-backend.141.253.110.210.sslip.io}`)"
      - "traefik.http.routers.backend-http.entrypoints=http"
      - "traefik.http.routers.backend-http.service=backend-svc"
      # HTTPS router (with Let's Encrypt when SSL is ready)
      - "traefik.http.routers.backend-https.rule=Host(`${BACKEND_DOMAIN:-backend.141.253.110.210.sslip.io}`)"
      - "traefik.http.routers.backend-https.entrypoints=https"
      - "traefik.http.routers.backend-https.tls=true"
      - "traefik.http.routers.backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-https.service=backend-svc"
      # Backend loadbalancer port
      - "traefik.http.services.backend-svc.loadbalancer.server.port=8000"

  # ── Frontend React & Static Nginx Service ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://backend.141.253.110.210.sslip.io}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://hrvbsbkcbtgephuntgqd.supabase.co}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_sR5TVVYw_9RyWoCL6wViZQ_kGGjnkky}
        - SITE_URL=${SITE_URL:-http://frontend.141.253.110.210.sslip.io}
    container_name: mlblock-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mlblock-network
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      # HTTP router (active immediately)
      - "traefik.http.routers.frontend-http.rule=Host(`${FRONTEND_DOMAIN:-frontend.141.253.110.210.sslip.io}`)"
      - "traefik.http.routers.frontend-http.entrypoints=http"
      - "traefik.http.routers.frontend-http.service=frontend-svc"
      # HTTPS router (with Let's Encrypt when SSL is ready)
      - "traefik.http.routers.frontend-https.rule=Host(`${FRONTEND_DOMAIN:-frontend.141.253.110.210.sslip.io}`)"
      - "traefik.http.routers.frontend-https.entrypoints=https"
      - "traefik.http.routers.frontend-https.tls=true"
      - "traefik.http.routers.frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-https.service=frontend-svc"
      # Frontend loadbalancer port
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=80"

networks:
  mlblock-network:
    driver: bridge
